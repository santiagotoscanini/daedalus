[package]
name = "daedalus-agent"
version = "0.23.0"
edition = "2021"
rust-version = "1.85"
description = "The daedalus agent: keeps a machine on the network awake, reports on it, and updates itself."
repository = "https://github.com/santiagotoscanini/daedalus"
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "daedalus_agent"
path = "src/lib.rs"

# The service and its verbs.
[[bin]]
name = "daedalus-agent"
path = "src/bin/daedalus-agent.rs"

# The tray: a windowless program in the desktop session that shows what the
# service reports (and on Windows and macOS supervises Claude Code). Separate
# binary so it can be a GUI-subsystem executable (no console window at
# logon) while the verbs keep their console. On Linux it links GTK, so it is
# built for glibc only; the static musl service is built without the `tray`
# feature (`--no-default-features --bin daedalus-agent`), which skips it.
[[bin]]
name = "daedalus-agent-tray"
path = "src/bin/daedalus-agent-tray.rs"
required-features = ["tray"]

[features]
default = ["tray"]
# The tray's dependencies: tray-icon everywhere, tao's event loop on macOS,
# GTK's on Linux.
tray = ["dep:tray-icon", "dep:tao", "dep:gtk"]

[dependencies]
anyhow = "1"
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
# The line scan of every door (jsonl.rs): already in the tree through regex.
memchr = "2"
png = "0.18"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tiny_http = "0.12"
toml = "1"
# config.toml edited in place by `install` and a re-pin (config.rs), every
# other line, comment and table kept.
toml_edit = "0.25"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# The root helper's pattern selectors (root/): the regex engine the
# log filter already brings, not a second one.
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta"] }

# The controller link (link/): TLS 1.3 through rustls on every OS, over
# pure-Rust primitives the crate plugs in itself (link/crypto.rs) — X25519,
# ChaCha20-Poly1305, SHA-256 and HMAC, ed25519 — so the link builds no C
# crypto library for any target. ureq's HTTPS is unchanged (below).
rustls = { version = "0.23", default-features = false, features = ["std"] }
x25519-dalek = "2"
chacha20poly1305 = { version = "0.10", default-features = false }
hmac = "0.12"
zeroize = "1"

# The machine's own WireGuard tunnel to the box (tunnel/): boringtun's
# sans-IO `noise::Tunn` for the protocol — handshake, cookies, rekeying,
# replay, keepalives — and smoltcp for the TCP inside it, all in this
# process: no utun, no route, no listener. macOS and Linux only: boringtun's
# AEAD is ring's, a C library, so Windows (no tunnel in this version) builds
# none; gate.sh checks macOS with zig as ring's C compiler.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
boringtun = { version = "=0.7.1", default-features = false }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "socket-tcp-cubic"] }
# WireGuard keys as `wg` writes them, and PKCE's verifier and challenge
# (tunnel/, enroll.rs): base64.
base64 = "0.22"
# Sign-in (enroll.rs): the loopback callback's query, read and built, and
# its one-time state compared in constant time. Both already in the tree.
form_urlencoded = "1"
subtle = "2"

# Windows and macOS: the OS's own TLS (SChannel, Security.framework) rather
# than rustls: the machine's trust store decides, and no C crypto library
# has to be cross-compiled to check a target from another OS.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "gzip", "native-tls"] }
native-tls = "0.2"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.25", optional = true }
windows-service = "0.8"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_Dns",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Performance",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Services",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }


[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The menu bar app: tray-icon draws the item, tao runs the main-thread event
# loop AppKit requires (no window is ever opened; the process is an
# accessory, so no Dock icon).
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.25", optional = true }
tao = { version = "0.37", optional = true }
# Info.plist, the LaunchServices handlers and the install history read in
# process, binary or XML, from a bounded regular-file read (no `plutil`).
plist = { version = "1", default-features = false }

# Linux: rustls, so one static musl binary runs on any distribution without
# its OpenSSL. The trust store is the system's CA bundle
# (rustls-native-certs); Mozilla's roots (webpki-roots) are the fallback
# only when the system yields none — a container or a minimal image without
# ca-certificates (os/linux/mod.rs `tls`). The tray: GTK's main loop, and
# tray-icon over AppIndicator, which it loads at run time
# (libayatana-appindicator3); no libxdo, the menu has no accelerators.
[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "gzip", "tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.7"
webpki-roots = "0.26"
gtk = { version = "0.18", optional = true }
tray-icon = { version = "0.25", default-features = false, features = ["libappindicator"], optional = true }

# The app's TypeScript wire types are generated from this crate's types by a
# test (src/ts.rs), so ts-rs is a dev-dependency: no release binary links it.
[dev-dependencies]
ts-rs = { version = "12", default-features = false, features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
