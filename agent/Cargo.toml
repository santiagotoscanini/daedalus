[package]
name = "daedalus-agent"
version = "0.7.2"
edition = "2021"
rust-version = "1.85"
description = "The daedalus agent: keeps a machine on the network awake, reports on it, and updates itself."
repository = "https://github.com/santiagotoscanini/daedalus"
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "daedalus_agent"
path = "src/lib.rs"

# The service and its verbs.
[[bin]]
name = "daedalus-agent"
path = "src/bin/daedalus-agent.rs"

# The tray: a windowless program in the desktop session that shows what the
# service reports. Separate binary so it can be a GUI-subsystem executable
# (no console window at logon) while the verbs keep their console.
[[bin]]
name = "daedalus-agent-tray"
path = "src/bin/daedalus-agent-tray.rs"

[dependencies]
anyhow = "1"
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
png = "0.18"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# The OS's own TLS (SChannel, Security.framework, OpenSSL on Linux) rather
# than rustls: the machine's trust store decides, and no C crypto library
# has to be cross-compiled to check a target from another OS.
ureq = { version = "2", default-features = false, features = ["json", "gzip", "native-tls"] }
native-tls = "0.2"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.25"
windows-service = "0.8"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_Dns",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Performance",
  "Win32_System_RemoteDesktop",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }


[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The menu bar app: tray-icon draws the item, tao runs the main-thread event
# loop AppKit requires (no window is ever opened; the process is an
# accessory, so no Dock icon).
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.25"
tao = "0.37"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
