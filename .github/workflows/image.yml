# Builds the engine image and, for a release tag, publishes it to ghcr.
#
# Publishing happens on ONE event: a pushed tag matching `v*`. Nothing here
# runs on a push to main, and there is no manual dispatch, so until the first
# such tag exists the only thing this file does is build the image on a pull
# request that touches it — no login, no push, a read-only token.
#
# On GitHub-hosted runners for the same reason as ci.yml, and one more: the
# image is what a box that is not this one installs, so it has to build where
# no mirror exists. The Dockerfile's NPM_REGISTRY defaults to
# npmjs; the lockfile's integrity hashes are what pin the bytes.
#
# A release is `ghcr.io/<owner>/daedalus:<version>` and `:sha-<short sha>`, and
# the tag must say the version app/package.json does — the engine reports that
# file's version at run time, and an image labelled otherwise would lie. The
# digest is what to deploy by; it lands in the run summary and carries a
# provenance attestation. linux/amd64 only: the run stage holds a native
# argon2 binary for the platform that built it.
#
# Convention (same as ci.yml): third-party actions are pinned to full commit
# SHAs, and container images to digests (the Dockerfile's FROM).
name: Image

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-entrypoint.sh"
      - ".github/workflows/image.yml"

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          provenance: false

  publish:
    name: Publish to ghcr
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # The provenance attestation is signed with the run's OIDC identity.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          version="$(jq -r .version app/package.json)"
          if [ "$REF_NAME" != "v$version" ]; then
            echo "::error file=app/package.json::tag $REF_NAME does not match the engine version $version. Bump app/package.json first, then tag that commit."
            exit 1
          fi
          # ghcr names are lowercase; an owner's login need not be.
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo "image=$image"
            echo "version=$version"
            echo "tags=$image:$version,$image:sha-$(printf '%s' "$SHA" | cut -c1-7)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          # BuildKit's own provenance turns a one-platform image into an index
          # with an `unknown/unknown` entry; the attestation below replaces it.
          provenance: false

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo
            echo "\`$IMAGE@$DIGEST\`"
            echo
            echo "Tags: \`$TAGS\`"
          } >> "$GITHUB_STEP_SUMMARY"
