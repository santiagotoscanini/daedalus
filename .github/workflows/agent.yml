# The agent (agent/ — the Rust service for machines the box does not run).
#
# `check` runs on every PR and push to main that touches agent/: fmt, clippy
# with warnings denied, and the tests, on Windows, macOS and Linux (all three
# ship; on Linux clippy also runs without the GTK tray, as the static
# service is built; on macOS the app and its disk image are packaged, signed
# ad hoc, and opened in a smoke run). On an `agent-v*` tag, `build-windows`,
# `build-macos` (Daedalus Agent.app: zipped for the updater, in a disk image
# for people; agent/macos/package.sh), `build-linux` (the static musl
# service, x86_64 and aarch64, each on a runner of its own architecture so
# no cross toolchain is involved) and `build-linux-tray` (the GTK tray,
# glibc, x86_64 only) produce the assets, and `release` writes
# `release.json` — the product, version and tag, and per asset its target,
# role, name, SHA-256 and size — signs it once with the release key under
# its own context, and publishes a GitHub release every installed agent
# watches (agent/src/update/). Every asset carries a build provenance
# attestation as well. Every build is `--locked`, and a tag whose
# commit is not on main publishes nothing. A version whose Cargo.toml says
# `[package.metadata.release] draft = true` is published as a draft, which
# no agent and no website link sees until the operator publishes it
# (agent/README.md "Releasing").
#
# Two signatures on the Mac's app, for two audiences. Apple's — Developer
# ID codesign with the hardened runtime, notarization and a stapled ticket,
# for the app and again for the disk image — is what Gatekeeper looks at
# when a person opens it, and what the updater's fence asks for (our team,
# the fixed identifiers); it is made on the macOS runner from the `release`
# environment's certificate and App Store Connect key (the same six secrets
# santree's release uses; see agent/README.md "Releasing"), and without
# them the job fails. Ours — the raw ed25519 signature
# over the manifest from AGENT_SIGNING_KEY, whose public half is compiled
# into the agent — is what the updater checks, and it is made on Linux with
# openssl after the builds, in the `release` environment (the secret lives
# there, not in the repository), so the key is only ever read on a runner
# that never held a toolchain cache.
#
# Convention: third-party actions are pinned to full commit SHAs.
name: Agent

on:
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
    tags: ["agent-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  ASSET: daedalus-agent-x86_64-pc-windows-msvc.exe
  TRAY_ASSET: daedalus-agent-tray-x86_64-pc-windows-msvc.exe
  MAC_BUNDLE_ASSET: daedalus-agent-universal-apple-darwin.app.zip
  MAC_DMG_ASSET: daedalus-agent-macos.dmg
  LINUX_X64_ASSET: daedalus-agent-x86_64-unknown-linux-musl
  LINUX_ARM_ASSET: daedalus-agent-aarch64-unknown-linux-musl
  LINUX_TRAY_ASSET: daedalus-agent-tray-x86_64-unknown-linux-gnu

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runners ship rustup, so no third-party toolchain action to pin.
      # With no argument it installs what rust-toolchain.toml names — the
      # rustc the box builds the agent with, clippy and rustfmt — as every
      # job here does.
      - name: Toolchain
        run: rustup toolchain install
      # rust-toolchain.toml and rust-version name the same release, so every
      # build here is the MSRV build.
      - name: The toolchain is rust-version
        if: runner.os == 'Linux'
        run: |
          want="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          have="$(rustc --version | cut -d' ' -f2)"
          case "$have" in "$want" | "$want".*) ;; *) echo "::error::rustc $have, rust-version $want"; exit 1 ;; esac
      # The Linux tray links GTK and loads AppIndicator.
      - name: GTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-3-dev libayatana-appindicator3-dev
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy without the tray (Linux, as the static service is built)
        if: runner.os == 'Linux'
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      # The Mac's app as a release packages it (agent/macos/package.sh),
      # signed ad hoc: the bundle and its icon, the zip, the disk image's
      # window laid out by Finder — then what a Mac runs of it.
      - name: Package the app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cargo build --locked --bins
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          macos/package.sh "$version" target/debug "$RUNNER_TEMP/pkg"
      - name: Check the app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/pkg"
          app="$pkg/Daedalus Agent.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Read whole first: `grep -q` leaving early would SIGPIPE codesign
          # under pipefail.
          said="$(codesign -dv "$app/Contents/MacOS/daedalus-agent" 2>&1)"
          grep -qx 'Identifier=me.toscanini.daedalus-agent' <<< "$said"
          said="$(codesign -dv "$app" 2>&1)"
          grep -qx 'Identifier=me.toscanini.daedalus-agent-tray' <<< "$said"
          "$app/Contents/MacOS/daedalus-agent" version
          # The menu built in the window server, then gone.
          DAEDALUS_AGENT_SMOKE=1 "$app/Contents/MacOS/daedalus-agent-tray"
          # The zip unpacks to the one bundle, as the updater requires.
          x="$(mktemp -d)"
          ditto -x -k "$pkg/daedalus-agent-universal-apple-darwin.app.zip" "$x"
          [ "$(ls "$x")" = "Daedalus Agent.app" ]
          # The disk image: the app, the Applications link, the window's art
          # and the layout Finder wrote.
          mnt="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mnt" "$pkg/daedalus-agent-macos.dmg" > /dev/null
          test -d "$mnt/Daedalus Agent.app"
          [ "$(readlink "$mnt/Applications")" = /Applications ]
          test -f "$mnt/.background/background.png"
          test -f "$mnt/.DS_Store"
          hdiutil detach "$mnt" > /dev/null

  # The tag names the version; Cargo.toml must agree, or an agent would
  # install a release that reports a different version than its tag. And
  # the tagged commit must be on main: a tag on a stray branch ships to
  # every machine otherwise. And the session host's interop test must pass
  # against this version.
  guard:
    name: Tag matches Cargo.toml, commit on main
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${REF_NAME#agent-v}"
          crate="$(grep -m1 '^version = ' agent/Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          [ "$tag" = "$crate" ] || { echo "tag $tag != Cargo.toml $crate"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not on main; refusing to release it"; exit 1; }
      # session-host/interop builds this crate by path, --locked, and its
      # Cargo.lock names the crate's version: a bump that left that lock
      # behind (agent/gate.sh moves it) would ship an agent the session host's
      # interop test was never run against. session-host.yml's interop step.
      - name: Toolchain
        working-directory: session-host
        run: rustup toolchain install
      - name: Interop with the session host (format, clippy, test)
        working-directory: session-host/interop
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  build-windows:
    name: Build (windows)
    needs: guard
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Stage
        shell: bash
        run: |
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/daedalus-agent.exe" "dist/$ASSET"
          cp "target/x86_64-pc-windows-msvc/release/daedalus-agent-tray.exe" "dist/$TRAY_ASSET"
          cp install.ps1 dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-dist-windows
          path: agent/dist/
          if-no-files-found: error

  build-macos:
    name: Build (macos)
    needs: guard
    runs-on: macos-latest
    # The Apple signing secrets live in this environment, restricted to
    # agent-v* tags, so no other workflow in the repo can reach them.
    environment: release
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # One universal app rather than two per-arch downloads: Intel Macs
      # are still out there, and the updater's asset table names one file.
      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Universal binaries
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for bin in daedalus-agent daedalus-agent-tray; do
            lipo -create -output "$RUNNER_TEMP/bin/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
            lipo -info "$RUNNER_TEMP/bin/$bin"
          done
      # Gatekeeper refuses an app that is not signed and notarized, and the
      # updater's fence one not signed by our team: no Apple secrets, no
      # release.
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::error::no APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY in the release environment (agent/README.md \"Releasing\")"
            exit 1
          fi
          keychain="$RUNNER_TEMP/agent-signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign's first use of the key blocks on a GUI
          # prompt nothing on a runner can answer.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          if ! security find-identity -v -p codesigning "$keychain" \
              | grep -qF "$APPLE_SIGNING_IDENTITY"; then
            echo "::error::the imported certificate does not provide the expected signing identity"
            exit 1
          fi
      # The app signed and notarized, stapled, zipped; the disk image laid
      # out, signed, notarized and stapled (agent/macos/package.sh). Each
      # notarization must come back "Accepted" or the job fails.
      - name: Package, sign and notarize
        timeout-minutes: 60
        env:
          REF_NAME: ${{ github.ref_name }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s\n' "$APPLE_API_KEY" > "$APPLE_API_KEY_PATH"
          umask 022
          macos/package.sh "${REF_NAME#agent-v}" "$RUNNER_TEMP/bin" "$RUNNER_TEMP/pkg"
          rm -f "$APPLE_API_KEY_PATH"
      # What a Mac will check, checked here: our team and the fixed
      # identifiers (the updater's fence, agent/src/os/macos/bundle.rs),
      # Gatekeeper's verdict on the app and the disk image, both tickets,
      # the version, and the menu bar app building its menu.
      - name: Verify the app and the disk image
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/pkg"
          app="$pkg/Daedalus Agent.app"
          dmg="$pkg/$MAC_DMG_ASSET"
          team=H8M3SN9RDZ
          req() {
            echo "=anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = \"$team\" and identifier \"$1\""
          }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict -R "$(req me.toscanini.daedalus-agent-tray)" "$app"
          codesign --verify --strict -R "$(req me.toscanini.daedalus-agent)" "$app/Contents/MacOS/daedalus-agent"
          for target in "$app" "$app/Contents/MacOS/daedalus-agent"; do
            said="$(codesign -dv "$target" 2>&1)"
            grep -E '^(Identifier|TeamIdentifier|Timestamp|Runtime Version)=' <<< "$said"
            grep -qx "TeamIdentifier=$team" <<< "$said"
          done
          spctl --assess --type exec --verbose=4 "$app"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          # `stapler validate` asks Apple, so it fails for two reasons: no
          # ticket (the release must stop) or Apple not answering (santree's
          # v0.1.16 met a CloudKit 503) — retried, and then a warning.
          staple() {
            local out
            for attempt in 1 2 3 4 5; do
              out=$(xcrun stapler validate "$1" 2>&1) && { printf '%s\n' "$out"; return 0; }
              printf '%s\n' "$out"
              case "$out" in
                *CloudKit*|*"Status Code: 5"*|*"network connection"*|*"Could not connect"*) ;;
                *) return 1 ;;
              esac
              sleep $((attempt * 30))
            done
            echo "::warning::stapler could not reach Apple to confirm $1 after 5 tries; spctl accepted it above"
          }
          staple "$app"
          staple "$dmg"
          said="$("$app/Contents/MacOS/daedalus-agent" version)"
          [ "$said" = "daedalus-agent ${REF_NAME#agent-v}" ] || { echo "::error::the app says $said"; exit 1; }
          plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist" | grep -qx "${REF_NAME#agent-v}"
          DAEDALUS_AGENT_SMOKE=1 "$app/Contents/MacOS/daedalus-agent-tray"
      - name: Stage
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/pkg/$MAC_BUNDLE_ASSET" "$RUNNER_TEMP/pkg/$MAC_DMG_ASSET" dist/
          cp install.sh dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-dist-macos
          path: agent/dist/
          if-no-files-found: error

  # The service as one static musl binary per architecture: rustls for TLS,
  # no OpenSSL, no glibc, so it runs on any systemd distribution. Built
  # without the `tray` feature (GTK cannot be linked statically).
  build-linux:
    name: Build (linux ${{ matrix.arch }})
    needs: guard
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_var: LINUX_X64_ASSET
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset_var: LINUX_ARM_ASSET
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends musl-tools
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --no-default-features --bin daedalus-agent
      - name: Check the binary runs and is static
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/daedalus-agent"
          file "$bin"
          file "$bin" | grep -q "static" || { echo "::error::$bin is not statically linked"; exit 1; }
          "$bin" version
          "$bin" help > "$RUNNER_TEMP/help.txt"
          grep -q "session" "$RUNNER_TEMP/help.txt"
      - name: Stage
        env:
          TARGET: ${{ matrix.target }}
          ASSET_NAME: ${{ env[matrix.asset_var] }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/daedalus-agent" "dist/$ASSET_NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-dist-linux-${{ matrix.arch }}
          path: agent/dist/
          if-no-files-found: error

  # The tray for Linux desktops: GTK and AppIndicator are the desktop's own
  # libraries, so it is a glibc build, on the oldest Ubuntu runner for the
  # widest reach, and x86_64 only in this version.
  build-linux-tray:
    name: Build (linux tray)
    needs: guard
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-3-dev libayatana-appindicator3-dev
          rustup toolchain install
      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu --bin daedalus-agent-tray
      - name: Check the binary starts
        run: |
          set -euo pipefail
          # No display on a runner: the tray must say so in one line and exit 1.
          out="$(target/x86_64-unknown-linux-gnu/release/daedalus-agent-tray 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "no graphical session"
      - name: Stage
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/daedalus-agent-tray "dist/$LINUX_TRAY_ASSET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-dist-linux-tray
          path: agent/dist/
          if-no-files-found: error

  release:
    name: Sign and publish
    needs: [build-windows, build-macos, build-linux, build-linux-tray]
    runs-on: ubuntu-latest
    # AGENT_SIGNING_KEY lives in this environment, restricted to agent-v*
    # tags with the operator as required reviewer (agent/README.md
    # "Releasing"), so no other workflow — nor this one on another ref —
    # can read the key every installed agent trusts.
    environment: release
    permissions:
      contents: write
      # The provenance attestation is signed with the run's OIDC identity.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agent-dist-*
          path: dist
          merge-multiple: true
      # What the release is, as the updater reads it (agent/src/update/
      # feed.rs): each asset's target, role, name, SHA-256 and size.
      - name: Manifest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          entry() { # target role name
            jq -n --arg target "$1" --arg role "$2" --arg name "$3" \
              --arg sha256 "$(sha256sum "dist/$3" | cut -d' ' -f1)" \
              --argjson size "$(stat -c %s "dist/$3")" \
              '{target: $target, role: $role, name: $name, sha256: $sha256, size: $size}'
          }
          {
            entry x86_64-pc-windows-msvc service "$ASSET"
            entry x86_64-pc-windows-msvc tray "$TRAY_ASSET"
            entry universal-apple-darwin bundle "$MAC_BUNDLE_ASSET"
            entry universal-apple-darwin installer "$MAC_DMG_ASSET"
            entry x86_64-unknown-linux-musl service "$LINUX_X64_ASSET"
            entry aarch64-unknown-linux-musl service "$LINUX_ARM_ASSET"
            entry x86_64-unknown-linux-gnu tray "$LINUX_TRAY_ASSET"
          } | jq -s --arg version "${REF_NAME#agent-v}" --arg tag "$REF_NAME" \
            '{product: "daedalus-agent", version: $version, tag: $tag, assets: .}' > dist/release.json
          cat dist/release.json
      - name: Sign
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$AGENT_SIGNING_KEY" > key.pem
          # The manifest, under its own context (agent/src/update/signature.rs).
          { printf 'daedalus-agent release manifest v1\000'; cat dist/release.json; } > signed.bin
          openssl pkeyutl -sign -inkey key.pem -rawin -in signed.bin -out dist/release.json.sig
          [ "$(stat -c %s dist/release.json.sig)" = 64 ] || { echo "the manifest signature is not 64 bytes"; exit 1; }
          rm -f key.pem
          (cd dist && sha256sum release.json release.json.sig "$ASSET" "$TRAY_ASSET" \
            "$MAC_BUNDLE_ASSET" "$MAC_DMG_ASSET" "$LINUX_X64_ASSET" "$LINUX_ARM_ASSET" \
            "$LINUX_TRAY_ASSET" install.ps1 install.sh > SHA256SUMS)
          cat dist/SHA256SUMS
      # The agent's compiled-in keys must accept what was just signed, or
      # every installed agent would refuse this release: checked with the
      # current key (the first listed in agent/src/update/mod.rs).
      - name: Verify against the compiled-in key
        run: |
          set -euo pipefail
          hex="$(grep -A1 'RELEASE_PUBLIC_KEYS' agent/src/update/mod.rs | grep -o '"[0-9a-f]\{64\}"' | head -1 | tr -d '"')"
          printf '302a300506032b6570032100%s' "$hex" | xxd -r -p > pub.der
          openssl pkeyutl -verify -pubin -inkey pub.der -keyform DER -rawin -in signed.bin -sigfile dist/release.json.sig
      # GitHub's build provenance for every asset, the manifest and the
      # install scripts: which workflow run, commit and tag made them
      # (`gh attestation verify <file> -R santiagotoscanini/daedalus`). Beside
      # our signature, which is what an agent checks; this is for people.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/daedalus-agent-*
            dist/release.json
            dist/install.ps1
            dist/install.sh
      # Published as a draft when this version's Cargo.toml says so
      # (`[package.metadata.release] draft = true`): no agent sees a draft
      # (GitHub lists drafts to no one but the repository's writers, and the
      # updater skips any it is shown), and `releases/latest` — the
      # website's download — never points at one. The operator publishes it
      # after trying it (agent/README.md "Releasing"). Otherwise it is the
      # latest release, said explicitly: a future engine `v*` release must
      # pass --latest=false.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          draft="$(sed -n '/^\[package\.metadata\.release\]/,/^\[/p' agent/Cargo.toml | grep -cE '^draft *= *true' || true)"
          if [ "$draft" = 1 ]; then how="--draft"; else how="--latest"; fi
          echo "publishing $REF_NAME with $how"
          gh release create "$REF_NAME" "$how" \
            --title "daedalus-agent ${REF_NAME#agent-v}" \
            --notes "Windows x86_64: the service and the tray. macOS 13 or newer (universal): Daedalus Agent.app — the disk image to download and open, and the app bundle installed agents update to. Linux (systemd distributions): the static service for x86_64 and aarch64, and the tray for x86_64 desktops. Installed agents pick this up on their next check. New machines — a Mac: open \`$MAC_DMG_ASSET\`, drag the app into Applications and open it (headless: \`curl -fsSL https://daedalus.toscanini.me/install.sh | sudo sh\`), then Log in… from the menu bar; Windows, from an administrator PowerShell: \`irm https://daedalus.toscanini.me/install.ps1 | iex\`; Linux: \`curl -fsSL https://daedalus.toscanini.me/install.sh | sudo sh\` (with the controller's address and key fingerprint; see the Machines page)." \
            dist/release.json dist/release.json.sig \
            "dist/$ASSET" "dist/$TRAY_ASSET" "dist/$MAC_BUNDLE_ASSET" "dist/$MAC_DMG_ASSET" \
            "dist/$LINUX_X64_ASSET" "dist/$LINUX_ARM_ASSET" "dist/$LINUX_TRAY_ASSET" \
            dist/install.ps1 dist/install.sh dist/SHA256SUMS
