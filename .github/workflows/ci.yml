# Checks the engine on every push and pull request.
#
# On GitHub-hosted runners, deliberately — never the box's own builder. This is
# the CI for the software that runs the box, so it has to keep answering when
# the box is down, and the repo is public, so hosted minutes cost nothing.
#
# What each job proves:
#   app        frozen install, route generation + tsc, biome, vitest, the
#              production build, and that src/host/schema.ts and drizzle/ agree
#   nix        `nix flake check` — formatting and lint over every .nix file,
#              the test hosts under nix/tests evaluated as whole systems, and
#              the host agents' scripts built, which shellchecks them
#   shell      shellcheck over the shell scripts nix never wraps
#   workflows  actionlint and zizmor over every file in .github/workflows
#   advisories cargo audit over the three Cargo.lock files and pnpm audit --prod
#              over app/ and website/ (weekly and by hand only)
#   codeql     CodeQL's JavaScript/TypeScript and Actions queries; findings land
#              in the Security tab rather than failing the run
#
# The app job runs every check even after one fails, so a lint error does not
# hide a broken test.
#
# website/ has its own workflow (website.yml) and does not trigger this one.
# The agent's own checks are agent.yml's.
#
# Convention (same as website.yml): third-party actions are pinned to full
# commit SHAs, and container images to digests.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
  pull_request:
    paths-ignore:
      - "website/**"
  # Weekly as well: CodeQL's queries, the advisory databases and the npm
  # registry all move without a push, and a lockfile that stops installing
  # should be found before a deploy.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from app/package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # pnpm-workspace.yaml names npmjs already; the flag says so here as well,
      # where a reader looks first. What pins a tarball is the lockfile's
      # integrity hash, not the registry it came from, so npmjs has to serve the
      # same bytes, and minimumReleaseAge still applies to every entry.
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile --registry https://registry.npmjs.org/

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Lint and format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec biome ci --reporter=github .

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

      # drizzle.config.ts refuses to load without a DATABASE_URL; `check` and
      # `generate` never connect, so an address nothing listens on is enough.
      # A schema edit without its migration makes `generate` write a new file,
      # and that file is the failure.
      - name: Migrations match the schema
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          DATABASE_URL: postgres://ci@127.0.0.1:1/ci
        run: |
          pnpm exec drizzle-kit check
          pnpm exec drizzle-kit generate </dev/null
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --short -- drizzle
            echo "::error file=app/src/host/schema.ts::schema.ts changed without a migration. Run pnpm db:generate inside the app-daedalus container and commit app/drizzle/."
            exit 1
          fi

  nix:
    name: Nix (format, lint, module shape)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # nixfmt, statix and deadnix over every .nix file, nix's own check that
      # each exported nixosModule is a module, and the flake's `checks`:
      # example-host/ evaluated as a host, its site/ files through the readers
      # (example-host), and that host with every catalog leaf switched on
      # (all-modules), and the host agents' scripts built, so shellcheck runs on
      # each as mkAgent assembles it (agent-scripts).
      - run: nix flake check --print-build-logs

  # The scripts no nix derivation wraps, so nothing else shellchecks them. The
  # host agents' scripts are the nix job's (agent-scripts): linted one file
  # at a time, each would miss the names another piece of its agent sets.
  shell:
    name: Shell (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        uses: docker://koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d # v0.11.0
        with:
          args: >-
            docker-entrypoint.sh
            agent/install.sh agent/e2e-tunnel.sh agent/gate.sh
            agent/macos/package.sh agent/macos/icons/render.sh
            session-host/gate.sh
            release/image-walk.sh

  workflows:
    name: Workflows (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image carries shellcheck, so every `run:` block is linted too.
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          # Fail the run on a finding instead of uploading SARIF: a workflow
          # finding is a one-line fix and belongs in front of the push.
          advanced-security: false

  # Known advisories against what the lockfiles pin: the three Cargo.lock
  # files and the two pnpm projects' production dependencies. Weekly (and by
  # hand) only — a new advisory arrives without a push. A finding fails the
  # run; nothing is installed or built.
  advisories:
    name: Advisories (cargo audit, pnpm audit)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # cargo-audit from the flake's own nixpkgs, against RustSec's database.
      - name: cargo audit
        run: |
          failed=0
          for lock in agent/Cargo.lock session-host/Cargo.lock session-host/interop/Cargo.lock; do
            echo "::group::$lock"
            nix run --inputs-from . nixpkgs#cargo-audit -- audit --file "$lock" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Corepack runs the pnpm each package.json names; audit reads the
      # lockfile alone.
      - name: pnpm audit
        if: ${{ !cancelled() }}
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          failed=0
          for dir in app website; do
            echo "::group::$dir"
            (cd "$dir" && corepack pnpm audit --prod --registry https://registry.npmjs.org/) || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript, actions
          build-mode: none

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
