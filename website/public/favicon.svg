<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="daedalus">
  <!-- A square labyrinth: Daedalus built the one on Crete. Two turns on odd coordinates with a 2-unit
       line, so a 16px tab shows a crisp 1px spiral; the four-turn labyrinth (the nav's logo) is
       favicon.png and apple-touch-icon.png. -->
  <rect width="32" height="32" rx="7" fill="#e2795a"/>
  <path
    d="M3 3H27V27H3V9H21V21H9V15H15"
    stroke="#fdf3ef"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
