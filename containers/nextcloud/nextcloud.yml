# Dual-entrypoint (cfweb + websecure) so the same URL works behind
# the Cloudflare tunnel (plain HTTP) and on the LAN (HTTPS). A single
# router with both entrypoints would force `tls:` to apply to cfweb
# too (404 from CF). HSTS middleware is on both.
http:
  routers:
    nextcloud-cf-rtr:
      entryPoints: [ cfweb ]
      rule: "Host(`nextcloud.toscanini.me`)"
      service: nextcloud-svc
      middlewares: [ nextcloud-headers ]
    nextcloud-rtr:
      entryPoints: [ websecure ]
      rule: "Host(`nextcloud.toscanini.me`)"
      service: nextcloud-svc
      middlewares: [ nextcloud-headers ]
      tls:
        options: tls-opts@file

  services:
    nextcloud-svc:
      loadBalancer:
        servers:
          - url: "http://host.containers.internal:8082"

  middlewares:
    nextcloud-headers:
      headers:
        stsSeconds: 15552000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
