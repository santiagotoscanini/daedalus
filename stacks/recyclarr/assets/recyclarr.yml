# TRaSH-strict quality profiles + custom formats for the tv stack.
#
# ONE profile per service, spanning 2160p down to 1080p:
#   Radarr: "Best Available"       (remux-2160p-combined, remux trimmed)
#   Sonarr: "WEB-2160p (Combined)" (stock)
#
# A merged profile rather than a 4K/HD pair because the initial grab takes
# the best AVAILABLE release from the allowed list — the cutoff only governs
# later upgrades. So a title with no 4K source lands on 1080p instead of
# failing the search, and nothing has to know in advance which resolutions a
# given title exists in.
#
# The SQP templates are deliberately NOT used: they gate on minFormatScore
# 1000, reachable only via the HD/UHD Bluray release-group tier custom
# formats, so catalogue titles whose only releases come from untiered groups
# are rejected wholesale. Both profiles here carry minFormatScore 0.
#
# The `qualities:`/`upgrade:` overrides sit alongside a trash_id, which keeps
# recyclarr's automatic TRaSH custom-format group sync (Streaming Services,
# Audio, HDR, Golden Rule, Unwanted). A hand-written profile with no trash_id
# syncs none of them.
#
# ADDITIVE: creates the profiles + their custom formats and raises the
# quality-definition max sizes to unlimited (TRaSH). It never reassigns an
# existing movie/series to a profile — that stays a manual step in
# Radarr/Sonarr/Seerr.
#
# Reached via host.containers.internal (pasta host alias) on gluetun's
# published *arr ports. API keys come from env.sops (RADARR/SONARR_API_KEY).

radarr:
  radarr-main:
    base_url: http://host.containers.internal:7878
    api_key: !env_var RADARR_API_KEY
    quality_definition:
      type: movie
    quality_profiles:
      # Remux tiers are trimmed off the template: the initial grab takes the
      # highest-ranked AVAILABLE release, so leaving Remux-2160p allowed (with
      # quality_definition sizes unlimited) would pull 60-100 GB files. The
      # cutoff cannot prevent that — it only governs later upgrades.
      - trash_id: d1d310673359205736b4b84acd5ea8c8  # Remux 2160p (Combined)
        name: Best Available
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
          until_score: 10000
        qualities:
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities: [WEBDL-2160p, WEBRip-2160p]
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]
          - name: Bluray-720p
    custom_format_groups:
      add:
        # Only the UHD Golden Rule applies: the merged profile is on that
        # group's include list, not the HD one's. Its `x265 (no HDR/DV)`
        # still covers HD x265, which carries neither HDR nor DV.
        - trash_id: ff204bbcecdd487d1cefcefdbf0c278d  # [Optional] Golden Rule UHD
          select:
            - 839bea857ed2c0a8e084f3cbdbd65ecb  # x265 (no HDR/DV)
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
          select:
            - b8cd450cbfa689c0259a01d9e29ba3d6  # 3D
            - cae4ca30163749b891686f95532519bd  # AV1
            - b6832f586342ef70d9c128d40c07b872  # Bad Dual Groups
            - cc444569854e9de0b084ab2b8b1532b2  # Black and White Editions
            - ed38b889b31be83fda192888e2286d83  # BR-DISK
            - 0a3f082873eb454bde444150b70253cc  # Extras
            - e6886871085226c3da1830830146846c  # Generated Dynamic HDR
            - 90a6f9a284dff5103f6346090e6280c8  # LQ
            - e204b80c87be9497a8a6eaff48f72905  # LQ (Release Title)
            - 712d74cd88bceb883ee32f773656b1f5  # Sing-Along Versions
            - bfd8eb01832d646a0a89c4deb46f8564  # Upscaled

sonarr:
  sonarr-main:
    base_url: http://host.containers.internal:8989
    api_key: !env_var SONARR_API_KEY
    quality_definition:
      type: series
    quality_profiles:
      # Already WEB-only, minFormatScore 0 — needs no overrides.
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)
        reset_unmatched_scores:
          enabled: true
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
        reset_unmatched_scores:
          enabled: true
    custom_format_groups:
      add:
        # See the Radarr block: only the UHD Golden Rule targets the merged
        # profile, and its `x265 (no HDR/DV)` covers HD x265 too.
        - trash_id: e3f37512790f00d0e89e54fe5e790d1c  # [Optional] Golden Rule UHD
          select:
            - 9b64dff695c2115facf1b6ea59c9bd07  # x265 (no HDR/DV)
        - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
          select:
            - 15a05bc7c1a36e2b57fd628f8977e2fc  # AV1
            - 32b367365729d530ca1c124a0b180c64  # Bad Dual Groups
            - 85c61753df5da1fb2aab6f2a47426b09  # BR-DISK
            - 6f808933a71bd9666531610cb8c059cc  # BR-DISK (BTN)
            - fbcb31d8dabd2a319072b84fc0b7249c  # Extras
            - 9c11cd3f07101cdba90a2d81cf0e56b4  # LQ
            - e2315f990da2e2cbfc9fa5b7a6fcfe48  # LQ (Release Title)
            - 23297a736ca77c0fc8e70f8edd7ee56c  # Upscaled
