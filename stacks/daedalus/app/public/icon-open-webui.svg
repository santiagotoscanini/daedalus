<?xml version="1.0" encoding="UTF-8"?>
<!-- The upstream mark is a black disc with a white glyph, which is invisible
     on this dashboard. Referenced through an <img>, so no page CSS can reach
     inside it — but a media query in the file itself still applies, so the
     disc follows the viewer's theme rather than being hardcoded to one. -->
<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
    <style>
        .disc { fill: #111318; }
        .mark { fill: #fff; }
        @media (prefers-color-scheme: dark) {
            .disc { fill: #e9edf5; }
            .mark { fill: #111318; }
        }
    </style>
    <circle class="disc" cx="250" cy="250" r="250"/>
    <path class="mark" d="m335 150h40v200h-40zm-130 0a100 100 0 1 0 0 200 100 100 0 1 0 0-200zm0 40a60 60 0 1 1 0 120 60 60 0 1 1 0-120z"/>
</svg>
