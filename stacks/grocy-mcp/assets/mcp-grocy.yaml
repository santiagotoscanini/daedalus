# Grocy MCP config — served over HTTP for the LiteLLM gateway.
# Operational settings mirror the container env (belt-and-suspenders so
# precedence never matters); GROCY_API_KEY comes from env.sops. The tools
# block is the point of this file: a curated subset so gemma-4-12b isn't
# handed ~55 tools. Enable more by flipping `enabled` and rebuilding.
server:
  enable_http_server: true
  http_server_port: 8080
  # Duplicate structuredContent into a content text block — Open WebUI
  # only reads content. See the env mirror in grocy-mcp.nix.
  serialize_structured_to_content: true
grocy:
  base_url: https://grocy.toscanini.me
  enable_ssl_verify: true

