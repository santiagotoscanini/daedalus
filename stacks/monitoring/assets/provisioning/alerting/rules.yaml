# All alert rules for the home server, file-provisioned into Grafana's
# "System" folder, grouped by severity tier (Container / Critical /
# Predictive / Warning). File-provisioned — this file is the source of
# truth; UI edits to these rules don't persist.
#
# NOTE: no per-container CPU/RAM alerts exist because no rootless-visible
# per-container metric exists — cadvisor can't see cgroups under
# user.slice/user@1000.service. Liveness (container_up) is the coverage.

apiVersion: 1
groups:
  - orgId: 1
    name: Container Alerts
    folder: System
    interval: 1m
    rules:
      # Liveness via the container_up{} textfile metric (monitoring.nix's
      # host-liveness-exporter timer), NOT cadvisor's container_last_seen —
      # cadvisor can't see rootless-podman cgroups so that series is empty.
      # container_up{name="X"} is 1 when the declared container is running,
      # 0 when stopped/missing; fire on 0.
      - uid: container-disappeared-1
        title: Container Disappeared
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              # Aggregate by name so each frame is uniquely labelled — raw
              # container_up carries instance/job labels that the threshold
              # reducer collapses to {}, colliding across all 45 series
              # ("frame cannot uniquely be identified by its labels").
              expr: min by (name) (container_up)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          description: Container {{ $labels.name }} is down (container_up = 0).
          summary: A declared container has stopped unexpectedly
        labels:
          severity: warning
        isPaused: false
      # Watchdog for the watchdog: if the host-liveness-exporter timer dies,
      # container_up (and systemd_failed_units) freeze at their last values
      # and every liveness reading above is stale. node-exporter exports the
      # .prom file's mtime; alert when it stops being rewritten (the timer
      # ticks every 1min). noDataState: Alerting — the file vanishing
      # entirely is the same failure, worse.
      - uid: container-watchdog-stale-1
        title: Container Watchdog Stale
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: time() - node_textfile_mtime_seconds{file="/var/lib/node-exporter/textfile/liveness.prom"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 300
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          description: liveness.prom has not been rewritten for over 5 minutes — the host-liveness-exporter timer is dead and every container_up / systemd_failed_units reading is stale. Check `systemctl status host-liveness-exporter.timer`.
          summary: Container liveness exporter has stopped updating
        labels:
          severity: warning
        isPaused: false
  - orgId: 1
    name: Critical Alerts
    folder: System
    interval: 1m
    rules:
      - uid: host-disk-full-1
        title: Host Out of Disk Space
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|nfs|ramfs", mountpoint!~".*pods.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|nfs|ramfs"}) * 100
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: lt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: OK
        for: 5m
        annotations:
          description: Filesystem on {{ $labels.instance }} at {{ $labels.mountpoint }} has only {{ $values.A | humanizePercentage }} free space.
          summary: Host filesystem is almost full (< 10% left)
        labels:
          severity: critical
        isPaused: false
      - uid: host-oom-1
        title: Host Out of Memory
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: lt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: OK
        for: 5m
        annotations:
          description: Memory on {{ $labels.instance }} has only {{ $values.A | humanizePercentage }} available.
          summary: Host memory is critically low (< 10% available)
        labels:
          severity: critical
        isPaused: false
      - uid: host-oom-kill-1
        title: Host OOM Kill Detected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: increase(node_vmstat_oom_kill[5m])
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        annotations:
          description: An OOM (Out of Memory) kill event was detected on {{ $labels.instance }}. A process was killed due to memory exhaustion.
          summary: OOM kill detected on host
        labels:
          severity: critical
        isPaused: false
      - uid: host-cpu-overtemp-1
        title: Host CPU Overtemperature
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: max(node_hwmon_temp_celsius{chip=~".*coretemp.*"}) or vector(0)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 2m
        annotations:
          description: CPU temperature on {{ $labels.instance }} has reached {{ $values.A }}°C which exceeds safe limits.
          summary: Host CPU temperature is critically high
        labels:
          severity: critical
        isPaused: false
      # systemd_failed_units is a textfile gauge written by monitoring.nix's
      # host-liveness-exporter sweep (node-exporter runs WITHOUT
      # --collector.systemd, so node_systemd_unit_state does not exist).
      # noDataState: Alerting — if the gauge vanishes this pages
      # instead of going silently green.
      - uid: systemd-unit-failed-1
        title: Host Systemd Service Failed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: systemd_failed_units
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          description: "{{ $values.A }} systemd system unit(s) on {{ $labels.instance }} are in failed state. Run `systemctl --failed` on the host to see which."
          summary: Systemd service has failed
        labels:
          severity: critical
        isPaused: false
      # node_zfs_zpool_state emits one series per (zpool, state) — 1 on the
      # active state, 0 on the rest — so the non-online selector always
      # returns data on a healthy box (all zeros) and noDataState: Alerting
      # is safe: it only fires if the metric itself disappears. A degraded
      # mirror is otherwise completely silent.
      - uid: zfs-pool-state-1
        title: ZFS Pool Not Online
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: node_zfs_zpool_state{state!="online"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 1m
        annotations:
          description: ZFS pool {{ $labels.zpool }} is in state {{ $labels.state }}. A degraded mirror is otherwise silent — run `zpool status` on the host.
          summary: ZFS pool is not ONLINE
        labels:
          severity: critical
        isPaused: false
      # Covers both gluetun instances via the job label (job="gluetun" is
      # the TV stack, job="gluetun-ipcrawl" the ipcrawl app tunnel).
      - uid: vpn-tunnel-down-1
        title: VPN Tunnel Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: gluetun_vpn_status
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          description: VPN tunnel for {{ $labels.job }} ({{ $labels.instance }}) has been down for 10 minutes (gluetun_vpn_status = 0).
          summary: Gluetun VPN tunnel is down
        labels:
          severity: critical
        isPaused: false
  - orgId: 1
    name: Predictive Alerts
    folder: System
    interval: 1m
    rules:
      - uid: disk-fill-24h-1
        title: Disk Will Fill In 24 Hours
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|nfs|ramfs", mountpoint!~".*pods.*"}[6h], 86400)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: lt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 30m
        annotations:
          description: Based on current usage trends, filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} will be full within 24 hours.
          summary: Filesystem predicted to fill within 24 hours
        labels:
          severity: warning
        isPaused: false
      - uid: inodes-fill-24h-1
        title: Inodes Will Fill In 24 Hours
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: predict_linear(node_filesystem_files_free{fstype!~"tmpfs|nfs|ramfs", mountpoint!~".*pods.*"}[6h], 86400)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: lt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 30m
        annotations:
          description: Based on current usage trends, filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} will run out of inodes within 24 hours.
          summary: Filesystem inodes predicted to fill within 24 hours
        labels:
          severity: warning
        isPaused: false
  - orgId: 1
    name: Warning Alerts
    folder: System
    interval: 1m
    rules:
      - uid: host-cpu-load-1
        title: Host High CPU Load
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: (1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: OK
        for: 10m
        annotations:
          description: CPU load on {{ $labels.instance }} is {{ $values.A | humanizePercentage }}.
          summary: Host CPU load is high (> 80%)
        labels:
          severity: warning
        isPaused: false
      - uid: host-cpu-iowait-1
        title: Host High CPU IOWait
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: avg by(instance) (rate(node_cpu_seconds_total{mode="iowait"}[5m])) * 100
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: OK
        for: 10m
        annotations:
          description: CPU iowait on {{ $labels.instance }} is {{ $values.A | humanizePercentage }}. This indicates disk I/O bottleneck.
          summary: Host CPU iowait is high (> 10%)
        labels:
          severity: warning
        isPaused: false
      - uid: host-swap-filling-1
        title: Host Swap Filling Up
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: (1 - (node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes)) * 100 and node_memory_SwapTotal_bytes > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          description: Swap usage on {{ $labels.instance }} is {{ $values.A | humanizePercentage }}.
          summary: Host swap usage is high (> 80%)
        labels:
          severity: warning
        isPaused: false
      - uid: host-memory-pressure-1
        title: Host Memory Under Pressure
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: rate(node_vmstat_pgmajfault[5m])
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1000
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          description: High rate of major page faults ({{ $values.A }}/s) on {{ $labels.instance }} indicates memory pressure.
          summary: Host is experiencing memory pressure
        labels:
          severity: warning
        isPaused: false
      - uid: host-inodes-full-1
        title: Host Out of Inodes
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: (node_filesystem_files_free{fstype!~"tmpfs|nfs|ramfs", mountpoint!~".*pods.*"} / node_filesystem_files{fstype!~"tmpfs|nfs|ramfs"}) * 100
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: lt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: OK
        for: 5m
        annotations:
          description: Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has only {{ $values.A | humanizePercentage }} inodes free.
          summary: Host filesystem is running out of inodes (< 10% free)
        labels:
          severity: warning
        isPaused: false
      - uid: disk-read-latency-1
        title: Host Disk Read Latency High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: (rate(node_disk_read_time_seconds_total{device!~"sr.*"}[5m]) / rate(node_disk_reads_completed_total[5m])) and rate(node_disk_reads_completed_total[5m]) > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.1
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          description: Disk read latency on {{ $labels.instance }} device {{ $labels.device }} is {{ $values.A }}s.
          summary: Host disk read latency is high (> 100ms)
        labels:
          severity: warning
        isPaused: false
      - uid: disk-write-latency-1
        title: Host Disk Write Latency High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: (rate(node_disk_write_time_seconds_total{device!~"sr.*"}[5m]) / rate(node_disk_writes_completed_total[5m])) and rate(node_disk_writes_completed_total[5m]) > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.1
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          description: Disk write latency on {{ $labels.instance }} device {{ $labels.device }} is {{ $values.A }}s.
          summary: Host disk write latency is high (> 100ms)
        labels:
          severity: warning
        isPaused: false
      - uid: net-rx-errors-1
        title: Host Network Receive Errors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: (rate(node_network_receive_errs_total{device!~"lo|veth.*|br-.*|docker.*"}[5m]) / rate(node_network_receive_packets_total{device!~"lo|veth.*|br-.*|docker.*"}[5m])) * 100 and rate(node_network_receive_packets_total{device!~"lo|veth.*|br-.*|docker.*"}[5m]) > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          description: Network interface {{ $labels.device }} on {{ $labels.instance }} has {{ $values.A | humanizePercentage }} receive errors.
          summary: Host network receive errors detected (> 1%)
        labels:
          severity: warning
        isPaused: false
      - uid: net-tx-errors-1
        title: Host Network Transmit Errors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: (rate(node_network_transmit_errs_total{device!~"lo|veth.*|br-.*|docker.*"}[5m]) / rate(node_network_transmit_packets_total{device!~"lo|veth.*|br-.*|docker.*"}[5m])) * 100 and rate(node_network_transmit_packets_total{device!~"lo|veth.*|br-.*|docker.*"}[5m]) > 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          description: Network interface {{ $labels.device }} on {{ $labels.instance }} has {{ $values.A | humanizePercentage }} transmit errors.
          summary: Host network transmit errors detected (> 1%)
        labels:
          severity: warning
        isPaused: false
      - uid: host-clock-skew-1
        title: Host Clock Skew Detected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: abs(node_timex_offset_seconds)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          description: Clock on {{ $labels.instance }} is {{ $values.A }}s out of sync. This can cause issues with TLS certificates and distributed systems.
          summary: Host clock is out of sync (> 50ms drift)
        labels:
          severity: warning
        isPaused: false
      - uid: "tsdb-near-cap-1"
        title: Prometheus TSDB Approaching Cap
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: prometheus_tsdb_storage_blocks_bytes / prometheus_tsdb_retention_limit_bytes * 100
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 30m
        annotations:
          description: Prometheus TSDB is at {{ $values.A | humanizePercentage }} of its retention size cap. Either cardinality is growing or someone bumped retention. The size cap will start dropping old data at 100%.
          summary: Prometheus TSDB > 80% of size cap
        labels:
          severity: warning
        isPaused: false
      - uid: scrape-target-down-1
        title: Scrape Target Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: up
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: OK
        for: 5m
        annotations:
          description: Scrape target {{ $labels.instance }} of job {{ $labels.job }} is unreachable or returning errors (up = 0) — the exporter is down, the container is gone, or the endpoint 404s.
          summary: A prometheus scrape target is down
        labels:
          severity: warning
        isPaused: false
      # Scoped to job="gluetun" (the TV stack): ProtonVPN port forwarding
      # feeds qBittorrent there. job="gluetun-ipcrawl" has no port
      # forwarding configured and permanently reports 0 — including it
      # would fire forever.
      - uid: vpn-portfwd-lost-1
        title: VPN Port Forward Lost
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: gluetun_forwarded_ports_total{job="gluetun"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 30m
        annotations:
          description: Gluetun ({{ $labels.job }}) has had no forwarded port for 30 minutes — qBittorrent is unconnectable for incoming peers. Check the gluetun container logs and the ProtonVPN port-forward loop.
          summary: ProtonVPN forwarded port has been lost
        labels:
          severity: warning
        isPaused: false
      - uid: tls-cert-expiry-1
        title: TLS Certificate Expiring
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus-default
            model:
              expr: (min(traefik_tls_certs_not_after) - time()) / 86400
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 14
                    type: lt
                  operator:
                    type: and
                  reducer:
                    type: last
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 1h
        annotations:
          description: The soonest-expiring traefik TLS certificate has {{ $values.A }} days left — ACME renewal (normally at 30 days out) is not working. Check traefik logs and the Cloudflare DNS-01 credentials.
          summary: A traefik TLS certificate expires in < 14 days
        labels:
          severity: warning
        isPaused: false
