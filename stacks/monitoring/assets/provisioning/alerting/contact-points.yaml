# Email contact point → the operator's inbox, delivered via Grafana's own
# SMTP (GF_SMTP_*, see monitoring.nix; the same Gmail relay msmtp uses).

apiVersion: 1

contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: email-cp-1
        type: email
        settings:
          addresses: santiago@toscanini.me
        disableResolveMessage: false
