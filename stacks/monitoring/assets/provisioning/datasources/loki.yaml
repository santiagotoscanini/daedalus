# Provisioned Loki datasource. UID pinned so dashboards / alert rules
# that reference it keep resolving across rebuilds. Loki reaches this
# Grafana over the shared `monitoring-net` bridge (aardvark-dns).

apiVersion: 1

datasources:
  - name: loki
    uid: loki-default
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
