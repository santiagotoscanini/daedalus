# OpenTelemetry collector for Plane's instance metrics.
#
# Plane's celery beat fires plane.license.bgtasks.telemetry_metrics
# every METRICS_PUSH_INTERVAL_MINUTES; the worker builds a fresh
# MeterProvider, observes the gauges, force_flush()es and shuts down.
# So this receives one burst per interval, not a stream — hence the
# generous metric_expiration below.
#
# gRPC only: OTLP_ENDPOINT is parsed by plane/utils/otlp_endpoints.py,
# which derives host:port and hands it to the gRPC exporter.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Plane pushes at most every METRICS_PUSH_INTERVAL_MINUTES. The
    # exporter drops a series it hasn't seen for metric_expiration
    # (default 5m), which would blank every gauge between pushes —
    # keep this comfortably above the push interval.
    metric_expiration: 60m
    # service.name / instance_id / plane.instance.type ride the OTLP
    # Resource; without this they never become Prometheus labels.
    resource_to_telemetry_conversion:
      enabled: true
    # The gauges are already named plane_*_total upstream. Suffixing
    # would rename them per scrape-format rules and break the
    # dashboard's queries against the names Plane actually emits.
    add_metric_suffixes: false

service:
  telemetry:
    logs:
      level: warn
    # The collector's own metrics would need a second scrape target for
    # ~nothing: this pipeline has one producer and one consumer.
    metrics:
      level: none
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
