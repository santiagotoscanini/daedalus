# Pocket ID forward-auth middleware — attached to routers via
# myStack.webApps.<name>.auth = "oidc" (ref: oidc-auth@file).
# ${POCKET_OIDC_*} placeholders are resolved by the PLUGIN from
# traefik's process env (stacks/traefik/env.sops), not by the file
# provider — the rendered file in /nix/store carries no secrets.
# Session cookies are host-scoped (no SessionCookie.Domain): one
# silent redirect through id.toscanini.me per app instead of a
# domain-wide cookie every subdomain could replay (AUTH.md).
http:
  middlewares:
    oidc-auth:
      plugin:
        oidc:
          Secret: "${POCKET_OIDC_COOKIE_SECRET}"
          Provider:
            Url: "https://id.toscanini.me"
            ClientId: "${POCKET_OIDC_CLIENT_ID}"
            ClientSecret: "${POCKET_OIDC_CLIENT_SECRET}"
            UsePkce: true
          Scopes:
            - openid
            - profile
            - email
            - groups
