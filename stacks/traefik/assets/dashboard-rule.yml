# Traefik dashboard / API. LAN-only via pi-hole dns.hosts; the
# built-in `api@internal` service serves /api/* and /dashboard/*.
http:
  routers:
    traefik-rtr:
      entryPoints: [ websecure ]
      rule: "Host(`traefik.toscanini.me`)"
      service: api@internal
      tls:
        options: tls-opts@file
