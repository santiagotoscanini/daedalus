# Named TLS options referenced by every websecure router as
# `tls.options: tls-opts@file`. Loaded by Traefik's file provider.
tls:
  options:
    tls-opts:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        - TLS_AES_128_GCM_SHA256
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
        - TLS_FALLBACK_SCSV
      curvePreferences:
        - CurveP521
        - CurveP384
      sniStrict: true

    # Named options for the postgres TCP entrypoint. Direct-TLS
    # postgres clients (libpq 17+ / pgjdbc 42.7+ with
    # `sslnegotiation=direct`) send `postgresql` in the ALPN
    # extension; traefik must advertise the same protocol or it
    # responds with `tlsv1 alert no application protocol`.
    pg-tls:
      alpnProtocols:
        - postgresql
