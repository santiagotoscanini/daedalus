# OTel collector: bridges Open WebUI's OTLP/gRPC push to Prometheus's
# OTLP/HTTP receiver (Open WebUI only speaks gRPC; Prometheus only
# receives HTTP OTLP). Metrics-only — logs already flow journal→Loki.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  otlphttp/prometheus:
    # Prometheus's native OTLP ingest path (--web.enable-otlp-receiver).
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/prometheus]
  # Don't emit the collector's own internal metrics.
  telemetry:
    metrics:
      level: none
