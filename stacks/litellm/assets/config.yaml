# LiteLLM proxy config. Model definitions live HERE (source of truth,
# in git) — not the UI. STORE_MODEL_IN_DB=True is set only so the DB
# can hold virtual keys / budgets / spend logs (inherently stateful);
# do NOT add models via the UI or they escape the rebuild trail.

litellm_settings:
  # llama.cpp/Lemonade rejects some OpenAI sampling params; drop the
  # unsupported ones instead of 400ing the client.
  drop_params: true
  # One retry smooths transient failures while Lemonade swaps a model in.
  num_retries: 1
  callbacks:
    - prometheus
  success_callback:
    - prometheus
  failure_callback:
    - prometheus

# PG Vector store — served by the litellm-pgvector connector
# (stacks/litellm-pgvector) over traefik-net. `pg_vector` is NOT a
# direct pg connection: LiteLLM dials the connector's OpenAI-compatible
# /v1/vector_stores API, which stores embeddings (qwen3-embed, 1024-dim)
# in the litellm_vector db on the shared cluster.
#
# Stores are NOT declared here. A config-file `vector_store_registry` is
# dropped at runtime because STORE_MODEL_IN_DB=True makes LiteLLM's DB
# the authoritative registry (same reason models must not be UI-edited).
# Vector-store registrations are therefore DB state (like virtual keys):
#   1. create the store on the connector  → POST <connector>/v1/vector_stores
#   2. register it in LiteLLM             → POST /vector_store/new
#        {vector_store_id, custom_llm_provider: pg_vector,
#         litellm_params: {api_base: http://litellm-pgvector:8000,
#                          api_key: <PGVECTOR_SERVER_API_KEY>}}
# Then search via POST /v1/vector_stores/<id>/search or attach at chat
# time with tools:[{type:file_search, vector_store_ids:[<id>]}].
# See stacks/litellm-pgvector for the full flow. NOTE: LiteLLM UI RAG
# ingestion doesn't support pg_vector yet (BerriAI/litellm#26771) —
# populate stores through the connector's REST API, not the dashboard.

# Media models below all run on the Lemonade GPU box (gaming PC): STT,
# TTS, embeddings, image-gen. Open WebUI reaches them through this
# gateway (keys/metrics), never Lemonade directly.
#
# STT: `whisper-1` (kept as the gateway alias) → Lemonade
# Whisper-Large-v3-Turbo on the GPU. (subgen still serves bazarr
# directly on the tv stack — that path does NOT go through litellm.)
# Reranking on the gateway: Lemonade only serves `/v1/reranking`, and every
# LiteLLM rerank provider hard-posts to a `.../rerank` path, so a model_list
# entry can't reach it. Bodies+responses are already Cohere-shaped, so a
# pass-through forwards it. Exposed at `/reranking` (LiteLLM's own
# `/v1/rerank` route is reserved for model_list models and would shadow it).
# Model chosen via the request body; auth = master key; free/local.
general_settings:
  pass_through_endpoints:
    - path: "/reranking"
      target: "http://gaming-pc.local.toscanini.me:13305/v1/reranking"
      auth: true
      methods: ["POST"]
      headers:
        content-type: application/json

model_list:
  - model_name: whisper-1
    litellm_params:
      model: openai/Whisper-Large-v3-Turbo
      api_base: http://gaming-pc.local.toscanini.me:13305/api/v1
      api_key: "local-no-auth"
      timeout: 300  # cold calls load the model on the GPU box
    model_info:
      mode: audio_transcription
      # Local — pin cost to 0 (the name whisper-1 otherwise matches
      # OpenAI's $0.006/min in LiteLLM's price map).
      input_cost_per_second: 0
      output_cost_per_second: 0
      input_cost_per_token: 0
      output_cost_per_token: 0

  # Local chat: Gemma 4 12B MTP on the Lemonade server (gaming PC).
  # `openai/<id>` where <id> is Lemonade's model id from /api/v1/models;
  # the `openai/` prefix is the transport (OpenAI-compatible), not the
  # vendor. Lemonade loads models on demand — first call after idle
  # swaps the weights in, so keep the timeout generous. MTP = the model
  # ships a draft head for speculative decoding (faster tok/s).
  - model_name: gemma-4-12b
    litellm_params:
      model: openai/Gemma-4-12B-it-MTP-GGUF
      api_base: http://gaming-pc.local.toscanini.me:13305/api/v1
      api_key: "local-no-auth"
      timeout: 600  # cold model load on the gaming PC is slow
    model_info:
      mode: chat
      # Capabilities reported by Lemonade's /api/v1/models for this id.
      supports_function_calling: true
      supports_vision: true
      # 262144 total ctx is input+output combined; reserve 16384 for the
      # completion so long prompts don't starve the reply (245760+16384).
      max_input_tokens: 245760
      max_output_tokens: 16384
      # Local model — pin cost to 0 so spend analytics are exact and
      # LiteLLM stops logging "model not mapped, cost may be inaccurate".
      input_cost_per_token: 0
      output_cost_per_token: 0

  # Local chat: Huihui abliterated ("uncensored") Gemma 4 12B on the same
  # Lemonade server. Labels: custom, tool-calling (NO vision, unlike the
  # base gemma). 131072 total ctx → reserve 16384 for the completion.
  - model_name: gemma-4-12b-uncensored
    litellm_params:
      model: openai/Huihui-Gemma-4-12B-uncensored
      api_base: http://gaming-pc.local.toscanini.me:13305/api/v1
      api_key: "local-no-auth"
      timeout: 600  # cold model load on the gaming PC is slow
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false
      max_input_tokens: 114688
      max_output_tokens: 16384
      input_cost_per_token: 0
      output_cost_per_token: 0

  # Embeddings for Open WebUI RAG → Lemonade Qwen3-Embedding-0.6B on the
  # GPU (1024-dim; replaced nomic-embed-text-v1, which was 768-dim — so
  # any already-indexed knowledge bases must be re-indexed after this
  # switch). Tiny model, pinned on Lemonade so RAG stays warm.
  - model_name: qwen3-embed
    litellm_params:
      model: openai/Qwen3-Embedding-0.6B-GGUF
      api_base: http://gaming-pc.local.toscanini.me:13305/api/v1
      api_key: "local-no-auth"
      timeout: 120
    model_info:
      mode: embedding
      input_cost_per_token: 0
      output_cost_per_token: 0

  # Text-to-speech → Lemonade kokoro on the GPU.
  - model_name: kokoro
    litellm_params:
      model: openai/kokoro-v1
      api_base: http://gaming-pc.local.toscanini.me:13305/api/v1
      api_key: "local-no-auth"
      timeout: 120
    model_info:
      mode: audio_speech
      input_cost_per_token: 0
      output_cost_per_token: 0

  # Image generation → Lemonade on the GPU (working via ROCm; steps/cfg/
  # size come from the request or Lemonade's per-model image_defaults).
  # Open WebUI's built-in image button uses one of these (IMAGE_GENERATION_
  # MODEL, default z-image — fast + reliable); all are reachable through
  # the gateway. Chroma is the uncensored one (Flux.1 de-distilled);
  # flux-klein is FLUX.2 (highest quality, slowest).
  - model_name: z-image
    litellm_params:
      model: openai/Z-Image-Turbo
      api_base: http://gaming-pc.local.toscanini.me:13305/api/v1
      api_key: "local-no-auth"
      timeout: 300
    model_info:
      mode: image_generation
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: chroma
    litellm_params:
      model: openai/Chroma1-HD
      api_base: http://gaming-pc.local.toscanini.me:13305/api/v1
      api_key: "local-no-auth"
      timeout: 600  # de-distilled, real CFG → ~160s renders
    model_info:
      mode: image_generation
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: flux-klein
    litellm_params:
      model: openai/Flux-2-Klein-9B-GGUF
      api_base: http://gaming-pc.local.toscanini.me:13305/api/v1
      api_key: "local-no-auth"
      timeout: 600
    model_info:
      mode: image_generation
      input_cost_per_token: 0
      output_cost_per_token: 0

# TickTick tasks via the official remote MCP server. LiteLLM holds the
# static personal API token (TICKTICK_MCP_TOKEN, from env.sops) and
# injects it upstream, so any gateway client (Open WebUI) only presents
# its LiteLLM key — no per-client OAuth.
mcp_servers:
  TickTick:
    alias: "TickTick"
    url: https://mcp.ticktick.com
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/TICKTICK_MCP_TOKEN
    description: "TickTick tasks/lists/habits"
    mcp_info:
      server_name: "TickTick"
      logo_url: "https://storage.ghost.io/c/cc/ab/ccab8320-6881-4f00-a181-c9547b33ad7a/content/images/2023/05/TickTick---logo.png"
  Grocy:
    alias: "Grocy"
    url: http://mcp-grocy:8080/mcp
    transport: http
    description: "Grocy household inventory, chores, shopping lists"
    mcp_info:
      server_name: "Grocy"
      logo_url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/grocy.png"
