# SearXNG — the self-hosted metasearch engine behind the fleet's web
# search. Lives in the litellm stack because the gateway owns the
# capability; consumed by BOTH LiteLLM (registered as the `searxng`
# search_tool in ../config.yaml) and Open WebUI (its in-chat RAG web
# search), each dialing http://searxng:8080 over the private `websearch`
# bridge. Internal only — no ingress. The real secret_key is injected by
# the SEARXNG_SECRET env var (machine-generated, secrets/searxng-env);
# the value below is a non-secret placeholder so the file parses
# standalone.
# `remove`, not `engines: [{disabled: true}]`. `disabled` only means "not
# searched by default" — the engine is still REGISTERED and still runs its
# init, so wikidata went on throwing a 403 traceback at every boot for as
# long as it was listed that way. `remove` takes it out of the engine list
# entirely, which is what was meant all along.
#
# CAUTION when adding to this list: SearXNG networks are defined by the
# engine that OWNS them, so removing a network owner takes its dependents
# down with it — dropping `brave` alone makes brave.images/videos/news
# die at startup with `KeyError: 'brave'`. Grep the image's own defaults
# for `network: <name>` before removing anything:
#   podman run --rm --entrypoint sh <searxng-image> -lc \
#     "grep -nE '^\s*-?\s*(name|network):' /usr/local/searxng/searx/settings.yml"
# And note the failure is invisible from systemd: the unit is a oneshot
# with RemainAfterExit, so a container that crashes on a bad config
# leaves it `active` with nothing running. Confirm with `podman ps`.
use_default_settings:
  engines:
    remove:
      # Onion engines, and there is no tor proxy here — they fail to
      # register at every start.
      - ahmia
      - torch
      # Its SPARQL endpoint 403s this host, one full traceback per boot.
      - wikidata
      # Both block this host outright, and have on every single day a
      # search ran (2026-07-21, 07-23, 08-02 — three for three, over the
      # thirty days Loki keeps): startpage answers with a CAPTCHA and is
      # suspended for an hour, brave answers 429 and is suspended for
      # three minutes. Neither has ever returned a result here, so this
      # costs no coverage and removes two ~30-line tracebacks per search
      # — which was most of what this container logged.
      #
      # Expected rather than mysterious: both captcha residential IPs
      # making automated queries, and every search from this box leaves
      # on one home address. Nothing to fix on this side; drop these two
      # lines if the egress ever changes. wikipedia is deliberately NOT
      # here — one timeout on 07-23 in thirty days is a transient.
      - startpage
      # brave.{images,videos,news} declare `network: brave`, and a network
      # is defined by its owning engine — so removing `brave` alone takes
      # the network with it and the three dependents die at startup with
      # `KeyError: 'brave'`. They share the rate limit that got the parent
      # blocked, so they were going the same way regardless.
      - brave
      - brave.images
      - brave.videos
      - brave.news
      # DuckDuckGo's default backend rate-limits this host at a threshold
      # below how it is actually used: measured 2026-08-05, the third
      # search in a row gets a CAPTCHA and every one after it does too,
      # two seconds apart or twenty. Open WebUI's in-chat web search
      # issues several queries per turn, so in practice it captchas mid-
      # answer and logs a ~30-line traceback each time — which is what
      # was left in this container's log after the others were removed.
      #
      # `duckduckgo web` below is the SAME provider on its other backend
      # (`engine: duckduckgo_web`), and it does not rate-limit: four for
      # four in the same test where this one failed four for four. So
      # this is a backend swap, not a loss of DuckDuckGo. Nothing
      # references `network: duckduckgo`, and duckduckgo.{images,videos,
      # news} are a different module (`duckduckgo_extra`), so they are
      # unaffected.
      - duckduckgo

# Enabling engines the default set ships turned off. `remove` above shapes
# WHICH engines exist; this shapes which of them a default search uses.
engines:
  - name: duckduckgo web
    disabled: false

# `yep` was added here and taken out again the same day, and the reason is
# worth keeping: it passed a four-query test with 20 results every time,
# and then returned HTTP 403 once the day's testing had put ~15 queries
# through it — and kept returning 403 after the suspension expired. Same
# failure as startpage and brave, just at a higher threshold, and a
# four-query sample could not see it. mwmbl passed the same weak test and
# is NOT being added on that evidence.
#
# So a general search here is duckduckgo web + google cse, both of which
# have answered every one of the several dozen queries this box has made
# today. Anything added later needs to survive a burst, not a handful.

server:
  secret_key: "placeholder-overridden-by-SEARXNG_SECRET"
  # Single-user LAN tool — no bot-limiter (it needs a redis and would
  # otherwise 429 the callers' bursts).
  limiter: false
  image_proxy: true

search:
  # Callers parse the JSON response — the default build only enables
  # html, so json MUST be added or every search returns 403.
  formats:
    - html
    - json
