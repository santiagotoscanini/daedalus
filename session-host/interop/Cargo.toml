# The session host against the daedalus agent's OWN TLS client (agent/src/link:
# its pure-Rust crypto provider, its certificate, its pinning), in process.
#
# A crate of its own so the agent's dependency tree stays out of the session
# host's Cargo.lock and nix build: this runs in session-host/gate.sh only.
[package]
name = "session-host-interop"
version = "0.0.0"
edition = "2021"
publish = false

[dev-dependencies]
daedalus-session-host = { path = ".." }
daedalus-agent = { path = "../../agent", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync"] }
serde_json = "1"
tempfile = "3"
