# The session host against the daedalus agent: the agent's OWN TLS client
# (agent/src/link: its pure-Rust crypto provider, its certificate, its
# pinning) in process, and the whole santree path end to end — the
# controller's allow-list and policy, a node's santree door, santree's own
# client through it.
#
# A crate of its own so the agent's dependency tree stays out of the session
# host's Cargo.lock and nix build: this runs in session-host/gate.sh only.
[package]
name = "session-host-interop"
version = "0.0.0"
edition = "2021"
publish = false

[dev-dependencies]
daedalus-session-host = { path = ".." }
daedalus-agent = { path = "../../agent", default-features = false }
# santree's own client, at the session host's rev: what santree runs.
santree-remote-client = { git = "https://github.com/santree-ai/santree", rev = "1cb14ac0c8932925e7f228b4a4751b59731bdbce" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
serde_json = "1"
tempfile = "3"
