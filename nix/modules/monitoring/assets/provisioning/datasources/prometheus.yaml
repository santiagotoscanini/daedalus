# Provisioned Prometheus datasource. UID is preserved across reboots so
# the dashboard panels and alert rules (which reference this UID) keep
# resolving. `editable: false` makes the UI read-only for this entry.

apiVersion: 1

datasources:
  - name: prometheus
    uid: prometheus-default
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      pdcInjected: false
