# Loki single-binary config.
#
# - auth_enabled: false → single tenant, no X-Scope-OrgID header needed
#   from Grafana or Alloy. Same posture as prometheus on this box.
# - Filesystem store under /loki (bind-mounted from the host). TSDB
#   shipper writes its active index there too.
# - 30-day retention to roughly mirror prometheus retention. The
#   compactor handles deletion of expired chunks.
# - allow_structured_metadata=true: required by schema v13.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-active
    cache_location: /loki/tsdb-cache

limits_config:
  retention_period: 720h            # 30 days
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_series: 100000
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  compaction_interval: 10m

analytics:
  reporting_enabled: false
