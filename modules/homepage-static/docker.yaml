# homepage — docker / podman integration (DISABLED).
# https://gethomepage.dev/configs/docker/
#
# Left empty intentionally. Enabling it would require exposing the
# rootless podman socket at /run/user/1000/podman/podman.sock into
# this container. The dashboard's siteMonitor pings (one per tile,
# in services.yaml) already give us the "is it up?" signal without
# the extra socket surface area.
#
# To turn it on later:
#   1. Enable the user socket on the host:
#        services.podman.dockerSocket.enable = true;   # or
#        systemd --user enable --now podman.socket     # for rootless
#   2. Bind-mount the socket into this container in modules/homepage.nix:
#        volumes = [
#          ...
#          "/run/user/1000/podman/podman.sock:/var/run/docker.sock:ro"
#        ];
#   3. Uncomment the connection below and reference it in services.yaml
#      via `server: my-docker, container: <name>` per service.
#
# my-docker:
#   socket: /var/run/docker.sock
