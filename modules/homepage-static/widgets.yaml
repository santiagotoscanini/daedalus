# homepage — top-of-page info widgets.
# https://gethomepage.dev/widgets/
#
# Stripped down to just the host-resource readout. The page title is
# replaced by a CSS-injected "S2" wordmark on the info-widgets bar
# (see custom.css → #information-widgets::before).

---

- resources:
    # `label` is intentionally blank — the wordmark on the left of
    # the bar already says "S2", so showing "s2-server" too is
    # noisy.
    label: ""
    cpu: true
    memory: true
    uptime: true
    refresh: 3000
